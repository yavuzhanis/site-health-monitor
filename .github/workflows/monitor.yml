name: Universal Multi-Site Health Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Paketleri Yükle
        run: pip install -r requirements.txt

      - name: Siteleri Denetle & Panel Üret
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
          TIMEOUT_SECONDS: '8'
        run: python monitor.py

      - name: Durumu Kaydet (State JSON Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git commit -m "chore: update monitor state [skip ci]" || echo "Değişiklik yok"
          git push origin main || true

      - name: Statü Sayfasını GitHub Pages'e Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy-pages:
    needs: monitor
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4