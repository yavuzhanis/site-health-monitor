name: Universal Multi-Site Health Monitor

on:
  schedule:
    # 1. Saatlik Anlık Çökme Kontrolü (Her saatin 17. dakikası)
    - cron: '17 * * * *'
    # 2. Günlük 24 Saatlik Rapor (Her sabah Türkiye saatiyle 09:17 -> UTC 06:17)
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force_daily_report:
        description: 'Günlük bülteni şimdi gönder'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Siteleri Denetle ve Raporla
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TIMEOUT_SECONDS: '8'
          MAX_WORKERS: '10'
          SSL_EXPIRY_THRESHOLD_DAYS: '14'
          DAILY_REPORT: ${{ github.event.schedule == '17 6 * * *' || inputs.force_daily_report == true }}
        run: python monitor.py

      - name: Durumu Kaydet (State JSON)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: update monitor state [skip ci]"
              git pull --rebase origin main || true
              git push origin main
            else
              echo "Durum dosyasında değişiklik tespit edilmedi."
            fi
          fi
